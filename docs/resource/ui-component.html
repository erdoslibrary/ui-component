<meta name="claude:viewport-fit-sides" content="cover">
<title>UI 엘리먼트 표본실</title>

<style>
/* ============================================================
   DESIGN PLAN
   Layout: fixed technical-index sidebar (left) + specimen viewer (right).
   Content reads like a bound component catalog / lab reference card,
   not a dashboard — numbered plates, ruled tables, no rounded "cards everywhere".
   ============================================================ */
:root{
  --paper:      #eef0ea;   /* cool paper, not warm cream */
  --paper-raised:#f8f9f4;
  --ink:        #15170f;   /* near-black, slight green bias */
  --ink-soft:   #51564a;
  --line:       #c7cab9;
  --line-strong:#15170f;
  --signal:     #c44a1f;   /* burnt signal-orange, used sparingly */
  --moss:       #3c5b3f;   /* secondary accent — status / ok */
  --code-bg:    #15170f;
  --code-fg:    #eef0ea;
  --font-display: 'Fjalla One', 'Archivo Narrow', Impact, sans-serif;
  --font-body:    'IBM Plex Sans', 'Segoe UI', sans-serif;
  --font-mono:    'IBM Plex Mono', 'SF Mono', Consolas, monospace;
  color-scheme: light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--signal);color:var(--paper)}
img{max-width:100%}

.shell{
  display:flex;
  min-height:100%;
  padding-left:max(0px, env(safe-area-inset-left,0px));
  padding-right:max(0px, env(safe-area-inset-right,0px));
}

/* ---------- SIDEBAR / INDEX ---------- */
.index{
  width:300px;
  flex:0 0 300px;
  border-right:2px solid var(--line-strong);
  background:var(--paper-raised);
  display:flex;
  flex-direction:column;
  min-width:0;
}
.index-head{
  padding:22px 20px 16px;
  border-bottom:2px solid var(--line-strong);
}
.index-head .kicker{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.14em;
  color:var(--signal);
  text-transform:uppercase;
}
.index-head h1{
  font-family:var(--font-display);
  font-weight:400;
  font-size:30px;
  line-height:1.02;
  letter-spacing:.01em;
  margin:6px 0 8px;
  text-wrap:balance;
}
.index-head p{
  margin:0;
  font-size:12.5px;
  color:var(--ink-soft);
  max-width:46ch;
}
.index-scroll{
  flex:1;
  overflow-y:auto;
  padding:4px 0 24px;
}
.cat-group{margin-top:14px}
.cat-group:first-child{margin-top:8px}
.cat-label{
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:.12em;
  color:var(--ink-soft);
  text-transform:uppercase;
  padding:4px 20px;
  display:flex;
  justify-content:space-between;
  gap:8px;
}
.cat-count{color:var(--line);}
.elem-btn{
  width:100%;
  display:flex;
  align-items:baseline;
  gap:10px;
  padding:7px 20px;
  background:none;
  border:none;
  border-left:3px solid transparent;
  text-align:left;
  cursor:pointer;
  font-family:var(--font-body);
  font-size:13.5px;
  color:var(--ink);
}
.elem-btn:hover{background:#e3e6da}
.elem-btn .n{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--ink-soft);
  min-width:20px;
}
.elem-btn.active{
  background:var(--ink);
  color:var(--paper);
  border-left-color:var(--signal);
}
.elem-btn.active .n{color:#9fa88f}

/* ---------- MAIN / SPECIMEN VIEWER ---------- */
.viewer{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}
.viewer-head{
  padding:26px max(28px, env(safe-area-inset-right,0px)) 18px 28px;
  border-bottom:2px solid var(--line-strong);
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}
.viewer-head .titles .plate{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.12em;
  color:var(--signal);
}
.viewer-head h2{
  font-family:var(--font-display);
  font-weight:400;
  font-size:34px;
  margin:4px 0 8px;
  letter-spacing:.01em;
}
.viewer-head .desc{
  max-width:62ch;
  color:var(--ink-soft);
  font-size:14px;
}
.viewer-head .meta{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--ink-soft);
  text-align:right;
  white-space:nowrap;
  padding-top:4px;
}
.viewer-head .meta b{color:var(--ink);font-weight:600}

.stage-wrap{
  padding:24px max(28px, env(safe-area-inset-right,0px)) 10px 28px;
}
.stage-label{
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:.1em;
  color:var(--ink-soft);
  text-transform:uppercase;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
}
.stage{
  border:2px solid var(--line-strong);
  background:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px),
    var(--paper-raised);
  background-size:16px 16px;
  min-height:240px;
  position:relative;
}
.stage iframe{
  width:100%;
  height:240px;
  border:none;
  display:block;
  background:transparent;
}
.stage::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(21,23,15,.04);
}

.source-wrap{
  padding:22px max(28px, env(safe-area-inset-right,0px)) 40px 28px;
}
.tabs{
  display:flex;
  gap:0;
  border-bottom:2px solid var(--line-strong);
}
.tab-btn{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:.06em;
  padding:9px 18px;
  background:var(--paper);
  border:2px solid var(--line-strong);
  border-bottom:none;
  margin-right:-2px;
  margin-bottom:-2px;
  cursor:pointer;
  color:var(--ink-soft);
}
.tab-btn.active{
  background:var(--code-bg);
  color:var(--code-fg);
  position:relative;
  z-index:1;
}
.code-panel{
  background:var(--code-bg);
  color:var(--code-fg);
  border:2px solid var(--line-strong);
  position:relative;
}
.code-panel pre{
  margin:0;
  padding:20px 22px;
  overflow-x:auto;
  font-family:var(--font-mono);
  font-size:12.5px;
  line-height:1.65;
  white-space:pre;
}
.code-panel[hidden]{display:none}
.copy-btn{
  position:absolute;
  top:10px;
  right:12px;
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:.08em;
  background:transparent;
  border:1px solid #454a3b;
  color:#c6cab6;
  padding:5px 10px;
  cursor:pointer;
  text-transform:uppercase;
}
.copy-btn:hover{border-color:var(--signal);color:var(--signal)}

/* code token coloring (manual, static) */
.tag{color:#d08b5f}
.attr{color:#9fc39a}
.str{color:#e0b96d}
.com{color:#6f7566;font-style:italic}
.kw{color:#e0836b}
.prop{color:#9fc8c7}

footer.credit{
  padding:16px 28px 28px;
  font-family:var(--font-mono);
  font-size:10.5px;
  color:var(--ink-soft);
  border-top:1px solid var(--line);
}

@media (max-width: 860px){
  .shell{flex-direction:column}
  .index{
    width:100%;
    flex:0 0 auto;
    border-right:none;
    border-bottom:2px solid var(--line-strong);
    max-height:40vh;
  }
  .viewer-head h2{font-size:26px}
  .viewer-head{flex-direction:column}
  .viewer-head .meta{text-align:left}
}
body,.index,.viewer-head,.stage-wrap,.source-wrap{
  padding-left:max(16px, env(safe-area-inset-left,0px));
}
.shell{padding-left:0}
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<div class="shell">
  <aside class="index">
    <div class="index-head">
      <div class="kicker">FRONTEND REFERENCE · NO. 001–032</div>
      <h1>UI 엘리먼트<br>표본실</h1>
      <p>CareerFoundry의 32가지 UI 엘리먼트 사전을 바탕으로 제작한 프론트엔드 포트폴리오 데모. 좌측에서 항목을 선택하면 우측에 미리보기와 소스가 표시됩니다.</p>
    </div>
    <nav class="index-scroll" id="indexScroll"></nav>
  </aside>

  <main class="viewer">
    <div class="viewer-head">
      <div class="titles">
        <div class="plate" id="plateNo">PLATE 01</div>
        <h2 id="elName">—</h2>
        <div class="desc" id="elDesc"></div>
      </div>
      <div class="meta">
        <div>CATEGORY<br><b id="elCat">—</b></div>
      </div>
    </div>

    <div class="stage-wrap">
      <div class="stage-label"><span>LIVE PREVIEW</span><span id="stageTag">rendered in isolated frame</span></div>
      <div class="stage"><iframe id="previewFrame" title="component preview" sandbox="allow-scripts"></iframe></div>
    </div>

    <div class="source-wrap">
      <div class="tabs">
        <button class="tab-btn active" data-tab="html">HTML</button>
        <button class="tab-btn" data-tab="css">CSS</button>
        <button class="tab-btn" data-tab="js">JS</button>
      </div>
      <div class="code-panel">
        <button class="copy-btn" id="copyBtn">COPY</button>
        <pre id="codeHtml"><code></code></pre>
        <pre id="codeCss" hidden><code></code></pre>
        <pre id="codeJs" hidden><code></code></pre>
      </div>
    </div>

    <footer class="credit">UI ELEMENT GLOSSARY REFERENCE — CAREERFOUNDRY · DEMO BUILD BY 수목원</footer>
  </main>
</div>

<script>
/* ============================================================
   DATA — 32 UI elements, grouped per the glossary's own 4 categories
   ============================================================ */
var CATS = [
  {key:'input',     label:'입력 컨트롤 · INPUT CONTROLS'},
  {key:'nav',        label:'내비게이션 · NAVIGATIONAL'},
  {key:'info',       label:'정보 표시 · INFORMATIONAL'},
  {key:'container',  label:'컨테이너 · CONTAINERS'}
];

var ITEMS = [

{n:1, key:'accordion', cat:'container', name:'Accordion', desc:'클릭 시 콘텐츠 섹션을 펼치고 접어 제한된 공간에 많은 정보를 담는 엘리먼트.',
 html:
'<div class="accordion">\n' +
'  <div class="acc-item">\n' +
'    <button class="acc-trigger" aria-expanded="false">\n' +
'      <span>01 — 배송 정책</span>\n' +
'      <span class="acc-icon">+</span>\n' +
'    </button>\n' +
'    <div class="acc-panel">\n' +
'      <p>주문 후 평균 2~3영업일 이내 출고되며, 도서산간 지역은 1~2일 추가될 수 있습니다.</p>\n' +
'    </div>\n' +
'  </div>\n' +
'  <div class="acc-item">\n' +
'    <button class="acc-trigger" aria-expanded="false">\n' +
'      <span>02 — 환불 규정</span>\n' +
'      <span class="acc-icon">+</span>\n' +
'    </button>\n' +
'    <div class="acc-panel">\n' +
'      <p>제품 수령 후 7일 이내 미개봉 상태에서 환불 신청이 가능합니다.</p>\n' +
'    </div>\n' +
'  </div>\n' +
'  <div class="acc-item">\n' +
'    <button class="acc-trigger" aria-expanded="false">\n' +
'      <span>03 — 고객센터</span>\n' +
'      <span class="acc-icon">+</span>\n' +
'    </button>\n' +
'    <div class="acc-panel">\n' +
'      <p>평일 10:00–18:00 운영되며, 주말 및 공휴일은 휴무입니다.</p>\n' +
'    </div>\n' +
'  </div>\n' +
'</div>',
 css:
'.accordion{ border-top:1px solid #d8dacd; max-width:440px; }\n' +
'.acc-item{ border-bottom:1px solid #d8dacd; }\n' +
'.acc-trigger{\n' +
'  width:100%; display:flex; justify-content:space-between; align-items:center;\n' +
'  padding:14px 4px; background:none; border:none; cursor:pointer;\n' +
'  font-size:14px; text-align:left; color:#15170f;\n' +
'}\n' +
'.acc-icon{ font-size:18px; transition:transform .2s ease; color:#c44a1f; }\n' +
'.acc-trigger[aria-expanded="true"] .acc-icon{ transform:rotate(45deg); }\n' +
'.acc-panel{\n' +
'  max-height:0; overflow:hidden; transition:max-height .25s ease;\n' +
'}\n' +
'.acc-panel p{ margin:0 4px 16px; font-size:13px; color:#51564a; line-height:1.6; }',
 js:
'document.querySelectorAll(".acc-trigger").forEach(function(btn){\n' +
'  btn.addEventListener("click", function(){\n' +
'    var open = btn.getAttribute("aria-expanded") === "true";\n' +
'    var panel = btn.nextElementSibling;\n' +
'    btn.setAttribute("aria-expanded", String(!open));\n' +
'    panel.style.maxHeight = open ? "0px" : panel.scrollHeight + "px";\n' +
'  });\n' +
'});'},

{n:2, key:'bento', cat:'nav', name:'Bento Menu', desc:'도시락(벤토) 상자처럼 여러 서비스를 격자형 타일로 모아 보여주는 메뉴.',
 html:
'<button class="bento-trigger" id="bentoBtn">⠿ 서비스</button>\n' +
'<div class="bento-panel" id="bentoPanel" hidden>\n' +
'  <a class="bento-tile" href="#">메일</a>\n' +
'  <a class="bento-tile" href="#">캘린더</a>\n' +
'  <a class="bento-tile" href="#">드라이브</a>\n' +
'  <a class="bento-tile" href="#">문서</a>\n' +
'  <a class="bento-tile" href="#">미팅</a>\n' +
'  <a class="bento-tile" href="#">연락처</a>\n' +
'</div>',
 css:
'.bento-trigger{\n' +
'  font-family:inherit; font-size:13px; padding:9px 14px;\n' +
'  background:#15170f; color:#eef0ea; border:none; cursor:pointer;\n' +
'}\n' +
'.bento-panel{\n' +
'  margin-top:8px; display:grid; grid-template-columns:repeat(3,64px);\n' +
'  gap:6px; width:fit-content;\n' +
'}\n' +
'.bento-tile{\n' +

'}\n' +
'.bento-tile:hover{ border-color:#c44a1f; color:#c44a1f; }',
 js:
'var b = document.getElementById("bentoBtn");\n' +
'var p = document.getElementById("bentoPanel");\n' +
'b.addEventListener("click", function(){ p.hidden = !p.hidden; });'},

{n:3, key:'breadcrumb', cat:'nav', name:'Breadcrumb', desc:'사용자가 사이트 내 현재 위치를 파악하고 상위 단계로 이동할 수 있게 돕는 경로 표시.',
 html:
'<nav class="crumb" aria-label="Breadcrumb">\n' +
'  <a href="#">홈</a>\n' +
'  <span>/</span>\n' +
'  <a href="#">로보틱스</a>\n' +
'  <span>/</span>\n' +
'  <a href="#">7축 그리퍼</a>\n' +
'  <span>/</span>\n' +
'  <span aria-current="page">캘리브레이션 로그</span>\n' +
'</nav>',
 css:
'.crumb{ font-size:13px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }\n' +
'.crumb a{ color:#51564a; text-decoration:none; border-bottom:1px solid transparent; }\n' +
'.crumb a:hover{ color:#c44a1f; border-color:#c44a1f; }\n' +
'.crumb span{ color:#9fa88f; }\n' +
'.crumb [aria-current="page"]{ color:#15170f; font-weight:600; }',
 js:''},

{n:4, key:'button', cat:'input', name:'Button', desc:'사용자가 특정 동작(제출, 취소 등)을 수행할 수 있음을 알려주는 핵심 입력 엘리먼트.',

'<div class="btn-row">\n' +
'  <button class="btn btn-primary">제출하기</button>\n' +
'  <button class="btn btn-ghost">취소</button>\n' +
'  <button class="btn btn-outline" disabled>비활성화</button>\n' +
'</div>',
 css:
'.btn-row{ display:flex; gap:10px; flex-wrap:wrap; }\n' +
'.btn{\n' +
'  font-family:inherit; font-size:13.5px; padding:10px 18px;\n' +
'  border:2px solid #15170f; cursor:pointer; transition:transform .1s ease;\n' +

{n:5, key:'card', cat:'container', name:'Card', desc:'이미지·텍스트·버튼 등 서로 다른 콘텐츠를 하나의 모듈로 묶어 나란히 배치하는 컨테이너.',
 html:
'<article class="ui-card">\n' +
'  <div class="ui-card-thumb">DXL · XL430</div>\n' +
'  <div class="ui-card-body">\n' +
'    <h3>3축 핑거 모듈</h3>\n' +

 css:
'.ui-card{\n' +
'  width:260px; border:1px solid #c7cab9; background:#f8f9f4;\n' +
'}\n' +
'.ui-card-thumb{\n' +
'  height:90px; background:repeating-linear-gradient(45deg,#15170f,#15170f 8px,#2a2d1f 8px,#2a2d1f 16px);\n' +

 js:''},

{n:6, key:'carousel', cat:'container', name:'Carousel', desc:'이미지나 카드 등 여러 콘텐츠 묶음을 같은 영역에서 좌우로 넘겨가며 보여주는 엘리먼트.',
 html:
'<div class="carousel">\n' +
'  <div class="car-track" id="carTrack">\n' +
'    <div class="car-slide">SLIDE 01</div>\n' +
'    <div class="car-slide">SLIDE 02</div>\n' +
'    <div class="car-slide">SLIDE 03</div>\n' +
'  </div>\n' +
'  <div class="car-controls">\n' +
'    <button id="carPrev">←</button>\n' +
'    <span id="carDots"></span>\n' +
'    <button id="carNext">→</button>\n' +
'  </div>\n' +
'</div>',
 css:
'.carousel{ width:280px; }\n' +
'.car-track{\n' +
'  display:flex; overflow:hidden; border:1px solid #c7cab9;\n' +
'}\n' +
'.car-slide{\n' +
'  min-width:100%; height:110px; display:flex; align-items:center; justify-content:center;\n' +
'  font-family:monospace; font-size:13px; background:#f8f9f4;\n' +
'  transition:transform .3s ease;\n' +
'}\n' +
'.car-controls{\n' +
'  display:flex; align-items:center; justify-content:space-between;\n' +
'  margin-top:8px;\n' +
'}\n' +
'.car-controls button{\n' +
'  background:#15170f; color:#eef0ea; border:none; width:28px; height:28px; cursor:pointer;\n' +
'}\n' +
'#carDots{ font-size:11px; letter-spacing:.2em; color:#9fa88f; }\n' +
'#carDots .active{ color:#c44a1f; }',
 js:
'var slides = document.querySelectorAll(".car-slide");\n' +
'var track = document.getElementById("carTrack");\n' +
'var dotsEl = document.getElementById("carDots");\n' +
'var idx = 0;\n' +
'function renderDots(){\n' +
'  var out = "";\n' +
'  for (var i=0;i<slides.length;i++){ out += (i===idx ? "<span class=active>●</span> " : "<span>○</span> "); }\n' +
'  dotsEl.innerHTML = out;\n' +
'}\n' +
'function go(n){\n' +
'  idx = (n + slides.length) % slides.length;\n' +
'  track.style.transform = "translateX(" + (-100*idx) + "%)";\n' +
'  renderDots();\n' +
'}\n' +
'document.getElementById("carPrev").addEventListener("click", function(){ go(idx-1); });\n' +
'document.getElementById("carNext").addEventListener("click", function(){ go(idx+1); });\n' +
'renderDots();'},

{n:7, key:'checkbox', cat:'input', name:'Checkbox', desc:'목록에서 하나 이상의 옵션을 독립적으로 선택할 수 있게 하는 작은 사각 박스.',

{n:11, key:'feed', cat:'info', name:'Feed', desc:'사용자 활동을 시간 순으로 보여주는 엘리먼트. 텍스트부터 이미지, 영상까지 다양한 형태를 포함.',

{n:12, key:'form', cat:'input', name:'Form', desc:'서로 연관된 정보를 입력받아 시스템에 제출하도록 돕는 입력 묶음.',

{n:13, key:'hamburger', cat:'nav', name:'Hamburger Menu', desc:'길이가 같은 세 개의 가로선으로, 주로 앱 좌상단에서 내비게이션 링크 그룹을 엽니다.',

{n:17, key:'loader', cat:'info', name:'Loader', desc:'시스템이 백그라운드에서 작업을 처리 중이니 기다려 달라고 알려주는 엘리먼트.',

{n:19, key:'modal', cat:'container', name:'Modal', desc:'사용자가 반드시 상호작용해야 닫히는, 흐름을 가로막는 작은 콘텐츠 창.',
 html:
'<button class="btn btn-primary" id="openModal">항목 삭제</button>\n' +
'<div class="modal-backdrop" id="modalBackdrop" hidden>\n' +
'  <div class="modal-box">\n' +
'    <h3>정말 삭제하시겠습니까?</h3>\n' +
'    <p>이 작업은 되돌릴 수 없습니다.</p>\n' +
'    <div class="modal-actions">\n' +
'      <button class="btn btn-ghost" id="closeModal">취소</button>\n' +
'      <button class="btn btn-primary" id="confirmModal">삭제</button>\n' +
'    </div>\n' +
'  </div>\n' +
'</div>',
 css:
'.btn{ font-family:inherit; font-size:13.5px; padding:10px 18px; border:2px solid #15170f; cursor:pointer; }\n' +
'.btn-primary{ background:#15170f; color:#eef0ea; }\n' +
'.btn-ghost{ background:transparent; color:#15170f; }\n' +
'.modal-backdrop{\n' +
'  position:fixed; inset:0; background:rgba(21,23,15,.55);\n' +
'  display:flex; align-items:center; justify-content:center;\n' +
'}\n' +
'.modal-box{\n' +
'  width:260px; background:#f8f9f4; border:2px solid #15170f; padding:20px;\n' +
'}\n' +
'.modal-box h3{ margin:0 0 8px; font-size:16px; }\n' +
'.modal-box p{ margin:0 0 16px; font-size:12.5px; color:#51564a; }\n' +
'.modal-actions{ display:flex; gap:8px; justify-content:flex-end; }',
 js:
'var open_ = document.getElementById("openModal");\n' +
'var back = document.getElementById("modalBackdrop");\n' +
'var close_ = document.getElementById("closeModal");\n' +
'var confirm_ = document.getElementById("confirmModal");\n' +
'open_.addEventListener("click", function(){ back.hidden = false; });\n' +
'close_.addEventListener("click", function(){ back.hidden = true; });\n' +
'confirm_.addEventListener("click", function(){ back.hidden = true; });'},

{n:20, key:'notification', cat:'info', name:'Notification', desc:'새 메시지, 오류, 처리 완료 등 사용자가 알아야 할 사항을 알리는 작은 표시.',

'}\n' +
'.notif-dot{\n' +
'  position:absolute; top:4px; right:4px; background:#c44a1f; color:#eef0ea;\n' +
'  font-family:monospace; font-size:10px; min-width:16px; height:16px; border-radius:50%;\n' +

'}\n' +
'.notif-hint{ font-size:11px; color:#9fa88f; margin:6px 0 0; }',
 js:

'var dot = document.getElementById("notifDot");\n' +
'bell.addEventListener("click", function(){ dot.style.display = "none"; });'},

{n:21, key:'pagination', cat:'nav', name:'Pagination', desc:'콘텐츠를 여러 페이지로 나누고, 현재 위치와 이동 경로를 보여주는 엘리먼트.',
 html:
'<div class="pager" id="pager">\n' +
'  <button class="pager-btn" id="pagerPrev">‹</button>\n' +
'  <span class="pager-nums" id="pagerNums"></span>\n' +
'  <button class="pager-btn" id="pagerNext">›</button>\n' +
'</div>',
 css:
'.pager{ display:flex; align-items:center; gap:6px; }\n' +
'.pager-btn, .pager-num{\n' +
'  width:30px; height:30px; border:1px solid #c7cab9; background:#f8f9f4;\n' +
'  cursor:pointer; font-family:monospace; font-size:12.5px; color:#15170f;\n' +
'}\n' +
'.pager-num.active{ background:#15170f; color:#eef0ea; border-color:#15170f; }\n' +
'.pager-nums{ display:flex; gap:6px; }',
 js:
'var total = 5, cur = 1;\n' +
'var numsEl = document.getElementById("pagerNums");\n' +
'function render(){\n' +
'  var out = "";\n' +
'  for (var i=1;i<=total;i++){\n' +
'    out += "<button class=\\"pager-num" + (i===cur ? " active" : "") + "\\" data-p=\\"" + i + "\\">" + i + "</button>";\n' +
'  }\n' +
'  numsEl.innerHTML = out;\n' +
'  numsEl.querySelectorAll(".pager-num").forEach(function(btn){\n' +
'    btn.addEventListener("click", function(){ cur = Number(btn.dataset.p); render(); });\n' +
'  });\n' +
'}\n' +
'document.getElementById("pagerPrev").addEventListener("click", function(){ if (cur>1){ cur--; render(); } });\n' +
'document.getElementById("pagerNext").addEventListener("click", function(){ if (cur<total){ cur++; render(); } });\n' +
'render();'},

/* ============================================================
   RENDER
   ============================================================ */
var indexScroll = document.getElementById('indexScroll');
var CAT_LABEL = {};
CATS.forEach(function(c){ CAT_LABEL[c.key] = c.label; });

CATS.forEach(function(cat){
  var group = ITEMS.filter(function(it){ return it.cat === cat.key; });
  var wrap = document.createElement('div');
  wrap.className = 'cat-group';
  var label = document.createElement('div');
  label.className = 'cat-label';
  label.innerHTML = '<span>' + cat.label + '</span><span class="cat-count">' + group.length + '</span>';
  wrap.appendChild(label);
  group.forEach(function(it){
    var btn = document.createElement('button');
    btn.className = 'elem-btn';
    btn.dataset.key = it.key;
    btn.innerHTML = '<span class="n">' + String(it.n).padStart(2,'0') + '</span><span>' + it.name + '</span>';
    btn.addEventListener('click', function(){ select(it.key); });
    wrap.appendChild(btn);
  });
  indexScroll.appendChild(wrap);
});

var plateNo = document.getElementById('plateNo');
var elName = document.getElementById('elName');
var elDesc = document.getElementById('elDesc');
var elCat = document.getElementById('elCat');
var frame = document.getElementById('previewFrame');
var codeHtml = document.querySelector('#codeHtml code');
var codeCss = document.querySelector('#codeCss code');
var codeJs = document.querySelector('#codeJs code');
var currentKey = null;

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildSrcdoc(item){
  return '<!doctype html><html><head><meta charset="utf-8">' +
    '<style>' +
    'html,body{margin:0;padding:18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;' +
    'color:#15170f;background:transparent;box-sizing:border-box;}' +
    '*{box-sizing:border-box}' +
    '</style>' +
    '<style>' + item.css + '</style>' +
    '</head><body>' + item.html +
    '<script>' + item.js + '<' + '/script>' +
    '</body></html>';
}

function select(key){
  var item = null;
  for (var i=0;i<ITEMS.length;i++){ if (ITEMS[i].key === key){ item = ITEMS[i]; break; } }
  if (!item) return;
  currentKey = key;

  document.querySelectorAll('.elem-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.key === key);
  });

  plateNo.textContent = 'PLATE ' + String(item.n).padStart(2,'0') + ' / 32';
  elName.textContent = item.name;
  elDesc.textContent = item.desc;
  elCat.textContent = CAT_LABEL[item.cat].split(' · ')[1] || CAT_LABEL[item.cat];

  frame.srcdoc = buildSrcdoc(item);

  codeHtml.textContent = item.html;
  codeCss.textContent = item.css || '/* 이 엘리먼트는 전용 CSS가 없습니다 */';
  codeJs.textContent = item.js || '// 이 엘리먼트는 자바스크립트가 필요 없습니다 (정적 마크업)';

  var active = document.querySelector('.tab-btn.active');
  var tab = active ? active.dataset.tab : 'html';
  showTab(tab);

  try { localStorage.setItem('ui-glossary-last', key); } catch(e){}
}

/* tabs */
document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    showTab(btn.dataset.tab);
  });
});
function showTab(tab){
  document.getElementById('codeHtml').hidden = tab !== 'html';
  document.getElementById('codeCss').hidden = tab !== 'css';
  document.getElementById('codeJs').hidden = tab !== 'js';
}

/* copy */
document.getElementById('copyBtn').addEventListener('click', function(){
  var active = document.querySelector('.tab-btn.active');
  var tab = active ? active.dataset.tab : 'html';
  var map = {html: codeHtml, css: codeCss, js: codeJs};
  var text = map[tab].textContent;
  var btn = document.getElementById('copyBtn');
  function done(ok){ btn.textContent = ok ? 'COPIED' : 'FAILED'; setTimeout(function(){ btn.textContent = 'COPY'; }, 1200); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }).catch(function(){ done(false); });
  } else {
    done(false);
  }
});

/* initial selection */
var startKey = 'accordion';
try {
  var saved = localStorage.getItem('ui-glossary-last');
  if (saved && ITEMS.some(function(it){ return it.key === saved; })) startKey = saved;
} catch(e){}
select(startKey);
</script>
